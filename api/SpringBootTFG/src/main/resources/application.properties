

###################################################################################

spring.application.name=api

# Render necesita un puerto din\uFFFDmico (y en local usar\uFFFD 8080)
server.port=${PORT:8080}

# La conexi\uFFFDn a BD vendr\uFFFD por variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# ===== POOL DE CONEXIONES (HIKARI) =====

# M\uFFFDximo de conexiones simult\uFFFDneas a MySQL
spring.datasource.hikari.maximum-pool-size=3

# M\uFFFDnimo de conexiones en reposo
spring.datasource.hikari.minimum-idle=1

# Tiempo m\uFFFDximo esperando una conexi\uFFFDn (ms)
spring.datasource.hikari.connection-timeout=30000 


# Tiempo m\uFFFDximo de vida de una conexi\uFFFDn (ms)
spring.datasource.hikari.max-lifetime=1800000

# Tiempo m\uFFFDximo que una conexi\uFFFDn puede estar inactiva (ms)
spring.datasource.hikari.idle-timeout=600000